<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Network Planet</title>
  </head>
  <body>
    <div id="globe"></div>
    <div id="flat" class="hidden"></div>

    <header id="topbar">
      <div class="brand">
        <img src="/favicon.svg" alt="" />
        <span>Network Planet</span>
      </div>
      <div id="stats" class="stats"></div>
      <div class="actions">
        <button class="btn primary" data-action="add-server" title="添加服务器">＋ 服务器</button>
        <button class="btn" data-action="add-link" title="添加连接">⇄ 连接</button>
        <button class="btn primary" data-action="local-monitor">本地测量</button>
        <button class="btn" data-action="install" title="一条命令在所有 VPS 上安装探针">⤓ 安装探针</button>
        <button class="btn" data-action="providers" title="通过供应商 API 导入">☁ API 导入</button>
        <button class="btn" data-action="matrix" title="互联延迟矩阵">▦ 矩阵</button>
        <button class="btn" data-action="import-export" title="JSON 导入导出">⇅</button>
        <button class="btn bell" data-action="events" title="告警">🔔<span class="badge-n hidden"></span></button>
        <button class="btn" data-action="settings" title="设置">⚙</button>
      </div>
    </header>

    <section id="map-placement" aria-label="地图节点位置"></section>
    <aside id="sidebar"></aside>
    <aside id="routepanel" class="hidden"></aside>
    <aside id="detail" class="hidden"></aside>

    <div id="viewbar">
      <button class="chip" data-mode="globe" title="3D 地球">🌐 地球</button>
      <button class="chip" data-mode="flat" title="平面点阵地图">🗺 平面</button>
      <button class="chip" data-mode="route" title="从本机 / 某台服务器 / 某个运营商出发，看到每台 VPS 怎么走、哪些需要中转">🧭 线路</button>
      <span class="sep"></span>
      <button class="chip" data-toggle="autoRotate" title="自动旋转">⟳ 自转</button>
      <button class="chip" data-toggle="expandCities" title="展开所有同城 VPS；关闭后恢复聚合">同城展开</button>
      <button class="chip" data-toggle="flatLocked" title="锁定左右边界：只显示一份世界地图，仍可缩放和拖动，但不能越过地图边缘；关闭后可以无限左右滑动">🔒 锁定</button>
      <button class="chip" data-toggle="showLinks" title="显示手动连接">⇄ 连接</button>
      <button class="chip" data-toggle="showMesh" title="显示 Agent 实测的全部互联">✱ 实测网格</button>
      <button class="chip" data-toggle="showLinkLabels" title="显示或隐藏所有连线的线路名称和延迟">线路 / 延迟</button>
      <button class="chip" data-toggle="showLabels" title="显示服务器名称">Aa 名称</button>
      <span class="sep"></span>
      <button class="chip" data-action="zoom-in" title="放大">＋</button>
      <button class="chip" data-action="zoom-out" title="缩小">－</button>
      <button class="chip" data-action="reset-view" title="复位视角">◎</button>
    </div>

    <div id="legend">
      <span><i style="background: var(--lat-good)"></i>&lt;60ms</span>
      <span><i style="background: var(--lat-ok)"></i>&lt;150ms</span>
      <span><i style="background: var(--lat-warn)"></i>&lt;250ms</span>
      <span><i style="background: var(--lat-bad)"></i>≥250ms</span>
      <span><i style="background: var(--muted)"></i>无数据/估算</span>
    </div>

    <div id="tooltip" class="hidden"></div>
    <div id="pickhint" class="hidden">在地球上点击选取位置 · <kbd>Esc</kbd> 取消</div>
    <div id="toasts"></div>
    <div id="modal-root"></div>
    <div id="loading"><div class="spinner"></div><span>正在生成地球…</span></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
